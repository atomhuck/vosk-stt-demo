server:
  port: 8080

interview:
  # Сколько тишины считать концом ответа, мс. Главный рычаг задержки решения:
  # решение приходит через end-silence-ms + ~0.05 мс расчёта (после союзов и коротких фраз порог автоматически больше).
  end-silence-ms: 450          # «мягкий» конец ответа: после этой тишины распознавание дожимается и готовится решение
  # Дополнительная пауза до ПРИНЯТИЯ решения (суммарная тишина = end-silence-ms + эта пауза):
  next-extra-ms: 150           # ответ достаточный → следующий вопрос: ≈ 0,6 с
  other-next-extra-ms: 600     # «не знаю», нет ответа, не по теме → следующий вопрос: ≈ 1,05 с
  follow-up-extra-ms: 1500     # ответ неполный → уточняющий вопрос: ≈ 2 с (человек чаще всего просто думает — не перебиваем)
  grace-ms: 1000               # окно отмены: после решения микрофон ещё открыт; следующий вопрос показывается после него
  max-follow-ups: 2          # не более N уточняющих вопросов на один основной
  no-speech-timeout-ms: 15000
  weak-coverage: 0.08
  # Максимальное ожидание уточнённого текста от STT перед подготовкой отчёта.
  refinement-wait-ms: 25000
  # Excel-отчёт по окончании интервью
  reports-dir: ./reports        # куда сохранять файлы
  report-download: true         # показывать ли кнопку «Скачать Excel» на странице (в отчёте есть эталонные ответы!)
  # Можно подменить банк вопросов / словарь внешними файлами (иначе берутся встроенные из resources/interview):
  # questions-path: D:/data/questions.tsv
  # glossary-path: D:/data/glossary.txt
