name: Build and validate

on:
  push:
    branches: [master, refactor/stt-diarization-service]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test, package and generate analytics Javadoc
        run: mvn -B clean test package javadoc:javadoc
      - name: Test, package and generate STT Javadoc
        run: mvn -B -f stt-service/pom.xml clean test package javadoc:javadoc
      - name: Test STT browser client
        shell: pwsh
        run: node --test (Get-ChildItem -Path stt-service/src/test/js -Filter '*.test.cjs' | Select-Object -ExpandProperty FullName)
      - name: Lint OpenAPI contracts
        shell: pwsh
        run: |
          $contracts = Get-ChildItem -Path docs/api -Filter '*.openapi.yaml' -Recurse
          foreach ($contract in $contracts) {
            npx --yes @redocly/cli@2.71.1 lint $contract.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
